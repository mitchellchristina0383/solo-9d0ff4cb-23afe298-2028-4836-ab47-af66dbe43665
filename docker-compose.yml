services:
  gpu-scheduler:
    build: .
    image: gpu-partition-scheduler:2.0.0
    container_name: gpu-partition-scheduler
    environment:
      # 模拟卡数：启动时按需调整，默认两张；也可用 GPU_IDS=gpu-a,gpu-b 显式指定卡 ID
      GPU_COUNT: "${GPU_COUNT:-2}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
